<!DOCTYPE html>
<html lang="pt">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Erickson Business</title>

    <link rel="stylesheet" href="../../css/style.css">

</head>

<body>

<header class="header">

    <div class="logo">
        ERICKSON<span>BUSINESS</span>
    </div>

</header>

<main>

<section class="cta">

    <h2>Área do cliente</h2>

    <p>
        Entre na sua conta para acompanhar
        os seus projetos.
    </p>

    <br>

    <form>

        <input
            type="email"
            placeholder="Seu e-mail"
            required>

        <br><br>

        <input
            type="password"
            placeholder="Sua senha"
            required>

        <br><br>

        <button
            type="submit"
            class="btn primary">
            Entrar
        </button>

    </form>

</section>

</main>

</body>
</html>
